[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oilcast"
version = "1.1.0"
description = "多因素油价智能分析与预测系统：真实可追溯数据、质量门、因素权重、短中长期预测与自动报告"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
