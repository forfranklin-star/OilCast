# 重大事件年表（major-event regime）
# ------------------------------------------------------------------
# 用途：为短期模型提供"重大冲击是否正在发生"的可审计 regime 特征 major_event_regime。
# 规则（务必遵守，避免数据造假）：
#   1. 只收录【公开、多源可核验、日期明确】的重大供给/需求/地缘冲击；
#      任何无法核实起止日期的事件一律不写，宁缺毋滥。
#   2. start/end 为事件对油价产生持续冲击的窗口（交易日落在窗口内 → regime=intensity）；
#      end 留空（null）表示截至当前数据仍在持续。
#   3. intensity∈(0,1] 表示冲击强度先验（1=直接供需冲击，较小值=间接/航运类），
#      仅作相对刻度，真正的影响方向与大小仍由模型在滚动窗内自行学习、随局势动态调整。
#   4. 每条必须给 source（可核验链接）与 note。新增事件请沿用同一格式。
# 说明：该特征与数据驱动的趋势/波动/回撤 regime 特征互为补充——后者是重大事件在价格上
#      的连续投影，本文件是离散、可解释、可审计的事件状态锚。
# ------------------------------------------------------------------

events:
  - name: "新冠疫情全球大流行 + 沙特-俄罗斯价格战（需求崩塌与供给冲击叠加）"
    type: "pandemic_demand_supply"
    start: "2020-01-30"   # WHO 宣布 PHEIC
    end: "2020-06-30"     # 覆盖主跌与剧烈修复期
    intensity: 1.0
    source: "https://www.who.int/news/item/29-06-2020-covidtimeline"
    note: "WHO 2020-01-30 宣布国际关注的突发公共卫生事件、2020-03-11 定性大流行；2020-03 沙特-俄罗斯增产价格战，WTI 4 月负油价。"

  - name: "俄罗斯入侵乌克兰，西方对俄能源制裁"
    type: "geopolitical_supply"
    start: "2022-02-24"
    end: "2022-12-31"
    intensity: 1.0
    source: "https://news.un.org/en/story/2022/02/1112582"
    note: "2022-02-24 俄罗斯对乌全面军事行动，布伦特 3 月冲上约 130 美元；随后西方对俄能源制裁、供给重塑。"

  - name: "红海/曼德海峡胡塞武装袭扰商船，绕行好望角"
    type: "shipping_chokepoint"
    start: "2023-11-19"   # 首次扣押商船 Galaxy Leader
    end: "2024-12-31"
    intensity: 0.7
    source: "https://www.energy.gov/documents/047-eia-red-sea-attacks-increase-shipping-times-and-freight-ratespdf"
    note: "2023-11-19 胡塞首次扣押关联以色列商船，随后袭扰红海航运、船舶绕行好望角，抬升航运与风险溢价（对原油为间接冲击，强度取 0.7）。"

  - name: "美以对伊朗军事打击，伊朗封锁霍尔木兹海峡（2026 中东战事，持续中）"
    type: "geopolitical_supply"
    start: "2026-02-28"   # 美以开始对伊朗空中打击、伊朗当晚宣布禁止船只通过霍尔木兹
    end: null             # 截至数据期末仍在持续
    intensity: 0.75       # 长期化对峙的基准强度（市场部分钝化）；升级阶段见 phases
    phases:                # 事件内部可核验的升级台阶，落在子区间时强度取 max
      - start: "2026-02-28"   # 开战+宣布封锁霍尔木兹、航运近乎停滞的冲击高峰
        end: "2026-03-31"
        intensity: 1.0
        source: "https://news.gmw.cn/2026-03/15/content_38647765.htm"
        note: "开战首月封锁海峡、航运停滞，风险溢价最陡。"
      - start: "2026-09-09"   # 美伊袭击升级、油轮战（Tanker War）升级，霍尔木兹对峙再紧张
        end: null
        intensity: 1.0
        source: "https://oilprice.com/Latest-Energy-News/World-News/Oil-Prices-Could-Top-120-as-Middle-East-Conflict-Escalates.html"
        note: "2026-09-09 起 'U.S.-Iran Attacks/Tanker War Escalates'，伊朗油轮被炸、霍尔木兹对峙升级；中国为伊朗原油主要买家，上海 SC 反应更强。"
    source: "https://news.gmw.cn/2026-03/15/content_38647765.htm"
    note: "2026-02-28 美以开始对伊朗空中打击，伊朗当晚宣布封锁霍尔木兹海峡，航运近乎停滞；期间 4 月临时停火后又相互封锁，长期对峙基准强度取 0.75，开战首月与 9 月油轮战升级阶段取 1.0（见 phases）；至 2026-09 仍在交火、国际油价一度再破 100 美元/桶。结束日期待事件明确结束后补填。"
