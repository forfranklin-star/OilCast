# ============================================================================
# OilCast 重大油价事件年表（2016-09 至今，与价格数据时间范围匹配）
# ----------------------------------------------------------------------------
# 用途：把公开、可核验、带观测日期的重大事件转成日频"事件状态"特征，供模型在
#       十年样本上学习各油种对地缘冲突 / 供给政策 / 实物中断 / 需求冲击的敏感度，
#       尤其让上海 INE 原油能在多次"对华中东供油链路"事件上学到真实敏感度。
#
# 铁律（与全项目一致）：
#   - 只收录公开、多源可核验、日期明确的重大事件；无法核实起止日期的一律不写。
#   - 第 t 行只反映"截至 t 事件是否正在发生"，无未来函数；滚动重训使权重随局势变化。
#   - 这是人工核验的历史年表（reference），不是新闻抓取，也绝不用于"补齐"缺失行情。
#
# 字段：
#   name         事件名
#   start/end    影响窗口起止（YYYY-MM-DD；end=null 表示持续至今）。脉冲事件给约
#                30 自然日窗口以覆盖冲击与消化；长期危机给实际起止。
#   intensity    0~1 的市场冲击强度（按供应中断规模 / 价格跳空 / 持续期标定，见 note）
#   category     geopolitical   地缘冲突、制裁、袭船、设施遇袭
#                supply_policy  OPEC+/SPR 等人为产量与储备政策
#                supply_outage  非地缘实物中断（寒潮、飓风、运河搁浅）
#                demand_shock   需求侧（疫情、金融危机）
#   china_supply true=直接扰动对华/经霍尔木兹的中东原油链路（伊朗制裁、海湾油轮战、
#                阿美遇袭、霍尔木兹封锁等）；用于上海 INE 特异敏感度。
#   source       可核验来源 URL（通讯社 / 官方 / 权威媒体 / 官方年表）
#   note         事实与口径说明
#   phases       事件内部升级/缓和子区间（在 base intensity 之上取 max）
# ============================================================================

events:

